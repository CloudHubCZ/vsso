apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: vaultsecrets.cz.vsso
spec:
  group: cz.vsso
  scope: Namespaced
  names:
    plural: vaultsecrets
    singular: vaultsecret
    kind: VaultSecret
    shortNames:
      - vs
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          description: VaultSecret defines a secret sourced from HashiCorp Vault.
          properties:
            apiVersion:
              type: string
              description: 'APIVersion defines the versioned schema of this representation of an object.'
            kind:
              type: string
              description: 'Kind is a string value representing the REST resource this object represents.'
            metadata:
              type: object
            spec:
              type: object
              properties:
                type:
                  type: string
                data:
                  type: object
                  additionalProperties:
                    type: string
                    format: byte
                stringData:
                  type: object
                  additionalProperties:
                    type: string
                immutable:
                  type: boolean
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                syncedAt:
                  type: string
                  format: date-time
                vaultVersion:
                  type: string
                secretName:
                  type: string
                hash:
                  type: string
                secretPhase:
                  type: string
                  enum:
                    - Pending
                    - Ready
                    - Error
                secretMessage:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Secret
          type: string
          jsonPath: .status.secretName
        - name: Path
          type: string
          jsonPath: .metadata.annotations['vault.hashicorp.com/path']
        - name: Synced
          type: string
          jsonPath: .status.syncedAt
